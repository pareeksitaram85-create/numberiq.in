name: Next.js CI/CD Audit

on:
  push:
    branches: [ "nextjs-production" ]
  pull_request:
    branches: [ "nextjs-production" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: deploy/package-lock.json

    - name: Install dependencies
      run: |
        cd deploy
        npm ci

    - name: Generate Prisma Client
      run: |
        cd deploy
        npx prisma generate

    - name: Run ESLint
      run: |
        cd deploy
        npm run lint

    - name: Run Vitest Unit Tests
      run: |
        cd deploy
        npm run test

    - name: Run Next.js Production Build (Offline Mode)
      run: |
        cd deploy
        npm run build
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mockdb"
        NEXTAUTH_SECRET: "mocksecretkeymocksecretkeymocksecret"
